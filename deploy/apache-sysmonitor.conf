# Expose ONLY web/ (never the repo root: config.php and data/ live there). Use HTTPS (certbot).
Alias /sysmonitor /opt/sysmonitor/web
<Directory /opt/sysmonitor/web>
    Require all granted
    # Pass the Authorization header through to PHP (needed with PHP-FPM / CGI)
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1
</Directory>
